name: Preview da melhoria no PR

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write

concurrency:
  group: preview-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  comentar-preview:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Comentar link de preview
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const pr = context.payload.pull_request;
            const sha = pr.head.sha;
            const branch = pr.head.ref;
            const urlCommit = `https://rawcdn.githack.com/${owner}/${repo}/${sha}/index.html`;
            const urlBranch = `https://raw.githack.com/${owner}/${repo}/${encodeURIComponent(branch)}/index.html`;
            const marker = '<!-- preview-fazenda-dos-irmaos -->';
            const body = [
              marker,
              '## 🎮 Testar esta versão do jogo',
              '',
              `**[▶️ Jogar esta melhoria agora](${urlCommit})**`,
              '',
              `⚠️ **Abra o link numa janela anônima NOVA** (Ctrl+Shift+N). Os previews dividem o mesmo cofre de save no navegador — janela anônima nova = jogo zerado, teste limpo.`,
              '',
              `Esse link abre exatamente a versão deste PR (commit \`${sha.substring(0, 7)}\`), sem mexer no jogo oficial.`,
              'Se entrarem commits novos neste PR, eu atualizo este comentário sozinho com o link novo — aí precisa testar de novo.',
              '',
              `Link alternativo (sempre a última versão da branch, pode levar ~5 min pra atualizar): ${urlBranch}`,
              '',
              '---',
              '✅ Gostou? Aprova o PR e faz o merge — o jogo oficial atualiza sozinho em ~1 minuto.',
              `🕹️ O jogo oficial continua intocado em https://${owner}.github.io/${repo}/ até o merge.`,
            ].join('\n');

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: pr.number,
              per_page: 100,
            });
            const existente = comments.find(c => c.body && c.body.includes(marker));
            if (existente) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existente.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: pr.number, body });
            }
